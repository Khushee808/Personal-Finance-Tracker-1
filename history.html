<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Transactions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav><b>🌿 Personal Finance Tracker</b>
        <div><a href="index.html">Dashboard</a><a href="history.html">Transactions</a><a
                href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="#" id="logout">Logout</a>
        </div>
    </nav>
    <main>
        <h1>Transaction History</h1>
        <section class="panel">
            <table id="tbl" style="width:100%">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>
    <script src="app.js"></script>
    <script>let r = document.getElementById("rows"); r.innerHTML = data.map((x, i) => `<tr><td>${x.date}</td><td>${x.type}</td><td>${x.cat}</td><td>${x.desc}</td><td>${money(x.amount)}</td><td><button onclick="data.splice(${i},1);save();location.reload()">Delete</button></td></tr>`).join("") || "<tr><td colspan=6>No transactions found.</td></tr>"</script>
</body>

</html>
